name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lanbox-web
      - uses: actions/checkout@v4
        with:
          repository: RakhaYandra/lanbox
          path: lanbox
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: lanbox-web/package-lock.json
      - name: Build web
        working-directory: lanbox-web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Install browsers
        working-directory: lanbox-web
        run: npx playwright install --only-shell chromium
      - name: Run E2E
        working-directory: lanbox-web
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            lanbox-web/playwright-report
            lanbox-web/test-results
